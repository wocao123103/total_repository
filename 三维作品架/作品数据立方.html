<!DOCTYPE html>
<html lang="zh-CN">
<!--
  作品数据立方 · xxy 的第 03 个作品
  把 作品目录.html 的「右侧留白」换成一个 3D 舞台；
  左侧列表、统计数字、图例、3D 柱子、详情卡，全部由 作品数据.js 生成。

  文件分工（想改哪里就看哪里）：
    样式.css     外观（沿用 作品目录.html 的白绿变量 + 夜间极光）
    作品数据.js       唯一数据源：作品 / 分类 / 视图
    场景脚本.js        读数据 → 生成 DOM 与 Three.js 场景；含相机推拉与 3D 空间放缩
    三维引擎.min.js  本地 three.js r155，离线可用，无 CDN

  双击本文件即可打开。三个 <script> 都是普通脚本、按先后顺序执行，
  不能用 type="module"：file:// 下模块会被跨域策略拦住。
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品数据立方 · xxy的作品</title>
  <meta name="description" content="用 Three.js 和数据驱动做出来的 3D 作品架：同一份数据同时长成目录、统计和柱状场景。">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23166b59'/%3E%3Ctext x='32' y='43' font-size='32' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3Ex%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="样式.css">
</head>

<body>

  <header class="site-header">
    <div class="site-logo">
      <span class="mark" aria-hidden="true">x.</span>
      <span class="name">xxy的作品</span>
    </div>
    <span class="breadcrumb">作品数据立方 / Three.js 实验</span>
    <!-- 两个真链接：回新版总览（本机作品的主入口），或去旧版目录 -->
    <div class="header-links">
      <a class="header-link header-link--back" href="../作品总览.html">← 作品总览</a>
      <a class="header-link" href="../前端html学习网页/作品目录.html">旧版目录 ↗</a>
    </div>
  </header>

  <div class="workspace">

    <!-- 左栏：三个区域全部由 JS 按数据生成，HTML 里只有空容器 -->
    <aside class="toc" aria-label="视图与作品目录">
      <p class="toc-title">视图 / VIEW</p>
      <div class="view-switch" id="view-switch"></div>

      <p class="toc-title">作品入口 / WORKS <em id="work-count"></em></p>
      <ul class="toc-list" id="toc-list"></ul>

      <div class="toc-tools">
        <button class="tool-btn" id="btn-jitter" type="button" title="随机改动体量指数，看画面跟着变">扰动数据</button>
        <button class="tool-btn" id="btn-reset" type="button" title="恢复 作品数据.js 里的原始数据">还原数据</button>
      </div>
      <p class="toc-hint" id="toc-hint"></p>
    </aside>

    <!-- 右栏：标题 + 统计条（数据算出来）+ 3D 舞台 -->
    <main class="reading">
      <div class="reading-inner">
        <h1 class="section-title" id="page-title"></h1>
        <div class="section-rule"></div>
        <p class="lead" id="page-lead"></p>
        <div class="stat-strip" id="stat-strip" aria-label="数据统计"></div>

        <div class="stage" id="stage">
          <canvas id="scene"></canvas>

          <div class="stage-hud" id="stage-hud">拖动旋转 · 滚轮缩放 · 点击柱子查看详情</div>
          <button class="night-btn" id="btn-night" type="button">☾ 夜间</button>
          <div class="legend" id="legend"></div>

          <!-- 两种缩放：上面改相机距离，下面直接缩放 3D 世界本身 -->
          <div class="zoom-panel">
            <div class="zoom-row">
              <span class="zoom-label">相机远近</span>
              <button class="zoom-btn" id="zoom-out" type="button" aria-label="推远">−</button>
              <input class="zoom-range" id="zoom-range" type="range" min="14" max="180" step="1" value="58" aria-label="相机距离">
              <button class="zoom-btn" id="zoom-in" type="button" aria-label="拉近">+</button>
              <em id="zoom-val">58</em>
            </div>
            <div class="zoom-row">
              <span class="zoom-label">空间放缩</span>
              <input class="zoom-range wide" id="scale-range" type="range" min="60" max="180" step="5" value="100" aria-label="3D 空间缩放比例">
              <em id="scale-val">1.00×</em>
            </div>
            <p class="zoom-tip">滚轮 / 双指 / 上面滑杆改相机距离；下面滑杆直接缩放整个 3D 世界。</p>
          </div>

          <!-- 详情卡：内容由 场景脚本.js 按选中项填充 -->
          <aside class="detail" id="detail" aria-live="polite">
            <button class="detail-close" id="detail-close" type="button" aria-label="关闭">×</button>
            <div id="detail-body"></div>
          </aside>
        </div>

        <p class="stage-note" id="stage-note"></p>
      </div>
    </main>

  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- 顺序不能换：先有库，再有数据，最后才是渲染逻辑 -->
  <script src="三维引擎.min.js"></script>
  <script src="作品数据.js"></script>
  <script src="场景脚本.js"></script>

</body>

</html>
